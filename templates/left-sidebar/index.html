<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>北京大学答辩模板 · HTML PPT</title>
<style>
/* =========================================================
   北京大学 红色学术答辩模板 — 复刻自参考 PPT
   尺寸基准：1920 × 1080 (16:9)，1pt ≈ 2px
   ========================================================= */
:root{
  /* —— 颜色 —— */
  --pku-red:#9E0000;        /* 主色：侧栏 / 标题 / Part 编号 */
  --pku-red-cover:#9B0000;  /* 封面大色块（参考稿略深一档） */
  --ink:#000000;            /* 正文标题黑 */
  --ink-soft:#404040;       /* 封面答辩人信息 */
  --ink-date:#262626;       /* 封面时间 */
  --line-gray:#BFBFBF;      /* 标题下细横线 */
  --page-gray:#A6A6A6;      /* 右下角页码 */
  --white:#FFFFFF;

  /* —— 字体 —— */
  --font:"Microsoft YaHei","微软雅黑","PingFang SC","Hiragino Sans GB",Arial,sans-serif;

  /* —— 字号（px，= pt×2）—— */
  --t-cover-title:120px;
  --t-cover-sub:48px;
  --t-presenter:40px;
  --t-date:36px;
  --t-toc-big:120px;     /* 目录 */
  --t-toc-en:80px;       /* CONTENTS */
  --t-toc-item:72px;     /* Part N / 章节标题 */
  --t-content-title:56px;/* 1. 研究背景 */
  --t-content-sub:40px;  /* 1.1 引言 */
  --t-page:26px;

  /* —— 布局 —— */
  --sidebar-w:306px;     /* 内容页侧栏宽（≈16%）*/
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#111;font-family:var(--font);}
/* 保证红色块在打印 / 导出 PDF 时不被浏览器去掉 */
*,*::before,*::after{-webkit-print-color-adjust:exact;print-color-adjust:exact;}

/* ====== 舞台：把 1920×1080 等比缩放并居中letterbox ====== */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#111;}
#deck{width:1920px;height:1080px;flex:none;flex-shrink:0;position:relative;transform-origin:center center;}
.slide{
  position:absolute;inset:0;width:1920px;height:1080px;
  background:var(--white);overflow:hidden;display:none;
}
.slide.active{display:block;}

/* ====== 通用绝对定位辅助 ====== */
.abs{position:absolute;}

/* ========================= 封面 / 结尾 ========================= */
.cover-logo{position:absolute;left:50%;top:96px;transform:translateX(-50%);
  display:flex;align-items:center;gap:26px;}
.cover-logo img{height:128px;width:auto;display:block;}
.cover-logo .wm{display:flex;flex-direction:column;justify-content:center;gap:8px;}
.cover-logo .wm .cn{font-size:46px;font-weight:700;color:var(--pku-red);letter-spacing:8px;line-height:1;}
.cover-logo .wm .en{font-size:20px;font-weight:700;color:var(--pku-red);letter-spacing:5.5px;line-height:1;}

.cover-block{position:absolute;left:0;top:341px;width:1920px;height:398px;background:var(--pku-red-cover);}
.cover-title{position:absolute;left:0;right:0;top:399px;text-align:center;
  font-size:var(--t-cover-title);font-weight:700;color:var(--white);line-height:1.15;
  letter-spacing:4px;padding:0 80px;}
.cover-sub{position:absolute;left:0;right:0;top:586px;text-align:center;
  font-size:var(--t-cover-sub);font-weight:700;color:var(--white);letter-spacing:3px;}

.cover-people{position:absolute;left:0;right:0;top:889px;display:flex;justify-content:center;gap:300px;}
.cover-people .item{font-size:var(--t-presenter);color:var(--ink-soft);}
.cover-people .item b{font-weight:700;}
.cover-date{position:absolute;left:0;right:0;top:954px;text-align:center;
  font-size:var(--t-date);color:var(--ink-date);letter-spacing:1px;}

/* ========================= 目录页 ========================= */
.toc-panel{position:absolute;left:13px;top:16px;width:545px;height:1048px;background:var(--pku-red);}
.toc-seal{position:absolute;left:166px;top:189px;width:239px;height:239px;}
.toc-seal img{width:100%;height:100%;object-fit:contain;}
.toc-cn{position:absolute;left:13px;width:545px;top:528px;text-align:center;
  font-size:var(--t-toc-big);font-weight:700;color:var(--white);letter-spacing:14px;line-height:1;}
.toc-en{position:absolute;left:13px;width:545px;top:748px;text-align:center;
  font-size:var(--t-toc-en);font-weight:700;color:var(--white);letter-spacing:8px;line-height:1;}

.toc-pagoda{position:absolute;right:0;top:16px;width:417px;height:1048px;
  object-fit:cover;opacity:.14;filter:grayscale(.4);pointer-events:none;}

.toc-list{position:absolute;left:689px;right:120px;top:0;bottom:0;
  display:flex;flex-direction:column;justify-content:center;}
.toc-row{display:flex;align-items:baseline;gap:48px;}
.toc-row .part{font-size:var(--t-toc-item);font-weight:700;color:var(--pku-red);white-space:nowrap;}
.toc-row .ttl{font-size:var(--t-toc-item);font-weight:700;color:var(--ink);}

/* ========================= 内容页 ========================= */
.side{position:absolute;left:0;top:0;width:var(--sidebar-w);height:1080px;background:var(--pku-red);}
.side-seal{position:absolute;left:55px;top:41px;width:196px;height:195px;}
.side-seal img{width:100%;height:100%;object-fit:contain;}
.side-rule{position:absolute;left:61px;top:262px;width:190px;height:2px;background:rgba(255,255,255,.55);}

/* 数据驱动左侧导航 */
.side-nav{position:absolute;left:0;right:0;top:300px;bottom:60px;
  display:flex;flex-direction:column;justify-content:center;gap:8px;}
.nav-item{position:relative;display:flex;align-items:center;min-height:52px;
  padding:10px 18px 10px 30px;color:var(--white);font-weight:400;
  font-size:30px;letter-spacing:2px;line-height:1.2;}
.nav-item.active{background:var(--white);color:var(--pku-red);font-weight:700;
  margin-left:18px;}

/* 右侧标题区 */
.c-title{position:absolute;left:338px;top:30px;font-size:var(--t-content-title);
  font-weight:700;color:var(--pku-red);letter-spacing:1px;}
.c-rule-gray{position:absolute;left:378px;top:117px;width:1515px;height:2px;background:var(--line-gray);}
.c-rule-red{position:absolute;left:348px;top:116px;width:81px;height:4px;background:var(--pku-red);}
.c-sub{position:absolute;left:338px;top:150px;font-size:var(--t-content-sub);
  font-weight:700;color:var(--ink);letter-spacing:1px;}
.c-body{position:absolute;left:338px;top:240px;right:90px;bottom:90px;
  font-size:34px;color:#222;line-height:1.7;}
.page-no{position:absolute;right:46px;bottom:38px;font-size:var(--t-page);color:var(--page-gray);}

/* ====== 导航按钮（在缩放层之外，始终可点） ====== */
#nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;z-index:50;
  background:rgba(0,0,0,.45);border-radius:999px;padding:8px 16px;
  font-family:var(--font);color:#fff;backdrop-filter:blur(4px);}
#nav button{appearance:none;border:none;background:transparent;color:#fff;
  font-size:20px;cursor:pointer;padding:4px 10px;border-radius:6px;line-height:1;}
#nav button:hover{background:rgba(255,255,255,.18);}
#nav .count{font-size:15px;min-width:54px;text-align:center;letter-spacing:1px;opacity:.9;}

/* ========================= 打印 / 导出 PDF ========================= */
@media print{
  @page{size:1920px 1080px;margin:0;}
  html,body{background:#fff;}
  #stage{position:static;display:block;overflow:visible;}
  #deck{transform:none!important;width:1920px;height:1080px;}
  #nav{display:none!important;}
  .slide{display:block!important;position:relative;page-break-after:always;break-after:page;}
  .slide:last-child{page-break-after:auto;}
}
</style>
</head>
<body>
<div id="stage"><div id="deck"></div></div>

<div id="nav">
  <button id="prev" title="上一页 (←)">‹</button>
  <span class="count"><span id="cur">1</span> / <span id="total">1</span></span>
  <button id="next" title="下一页 (→)">›</button>
  <button id="print" title="打印 / 导出PDF">⎙</button>
</div>

<script>
/* =======================================================================
   ① 配置区 —— 以后只改这里：标题 / 章节(sections) / 页面(slides)
   ======================================================================= */
const deckConfig = {
  /* 封面信息 */
  title:    "标题",
  subtitle: "副标题",
  presenter:"XXX",
  advisor:  "XXX",
  date:     "XX年XX月XX日",

  /* 章节：左侧导航栏 + 目录 Part 列表 由此自动生成，可任意增删 */
  sections:[
    { id:"background", title:"研究背景" },
    { id:"methods",    title:"研究方法" },
    { id:"results",    title:"研究结果" },
    { id:"conclusion", title:"研究结论" }
  ],

  /* 页面顺序：type = cover | contents | content | ending */
  slides:[
    { type:"cover" },
    { type:"contents" },
    { type:"content", sectionId:"background", subtitle:"1.1 引言",   body:"" },
    { type:"content", sectionId:"methods",    subtitle:"2.1 纳入标准", body:"" },
    { type:"content", sectionId:"results",    subtitle:"3.1 基线特征", body:"" },
    { type:"content", sectionId:"conclusion", subtitle:"4.1 研究结论", body:"" },
    { type:"ending",  title:"谢谢聆听", subtitle:"THANKS" }
  ]
};

/* =======================================================================
   ② 渲染引擎 —— 一般无需改动
   ======================================================================= */
const A = "assets/seal-white.png";   // 白色校徽（红底用）
const AR= "assets/seal-red.png";     // 红色校徽（白底用）
const AP= "assets/pagoda.png";       // 博雅塔装饰图

const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const sectionIndex = id => deckConfig.sections.findIndex(s=>s.id===id);

/* —— 封面 / 结尾（共享布局）—— */
function renderCover(s){
  const isEnd = s.type==="ending";
  const title = s.title ?? deckConfig.title;
  const sub   = s.subtitle ?? deckConfig.subtitle;
  const people = isEnd ? "" : `
    <div class="cover-people">
      <div class="item"><b>答辩人</b>：${esc(deckConfig.presenter)}</div>
      <div class="item"><b>指导老师</b>：${esc(deckConfig.advisor)}</div>
    </div>
    <div class="cover-date">答辩时间：${esc(deckConfig.date)}</div>`;
  return `
    <div class="cover-logo">
      <img src="${AR}" alt="北京大学校徽" />
    </div>
    <div class="cover-block"></div>
    <div class="cover-title">${esc(title)}</div>
    <div class="cover-sub">${esc(sub)}</div>
    ${people}`;
}

/* —— 目录页（Part 列表由 sections 自动生成）—— */
function renderContents(s){
  const n = deckConfig.sections.length;
  // 章节较多时自动缩小字号与行距，保持简洁留白
  const fs = n<=4 ? 72 : n<=6 ? 60 : n<=8 ? 50 : 42;
  const gap = n<=4 ? 96 : n<=6 ? 64 : 44;
  const rows = deckConfig.sections.map((sec,i)=>`
      <div class="toc-row" style="font-size:${fs}px">
        <span class="part">Part ${i+1}</span>
        <span class="ttl">${esc(sec.title)}</span>
      </div>`).join("");
  return `
    <div class="toc-panel"></div>
    <div class="toc-seal"><img src="${A}" alt="校徽" /></div>
    <div class="toc-cn">目录</div>
    <div class="toc-en">CONTENTS</div>
    <img class="toc-pagoda" src="${AP}" alt="博雅塔" />
    <div class="toc-list" style="gap:${gap}px">${rows}</div>`;
}

/* —— 内容页（左侧导航数据驱动 + 当前章节高亮）—— */
function renderContent(s){
  const idx = sectionIndex(s.sectionId);
  const sec = deckConfig.sections[idx] || {title:""};
  const n = deckConfig.sections.length;
  // 导航项随数量自适应字号 / 间距
  const navFs  = n<=5 ? 30 : n<=7 ? 26 : n<=9 ? 22 : 19;
  const navGap = n<=5 ? 10 : n<=7 ? 6 : 4;
  const nav = deckConfig.sections.map(item=>{
    const on = item.id===s.sectionId ? " active" : "";
    return `<div class="nav-item${on}" style="font-size:${navFs}px">${esc(item.title)}</div>`;
  }).join("");
  const num = idx>=0 ? (idx+1)+". " : "";
  const body = s.body ? `<div class="c-body">${s.body}</div>` : "";
  return `
    <div class="side">
      <div class="side-seal"><img src="${A}" alt="校徽" /></div>
      <div class="side-rule"></div>
      <div class="side-nav" style="gap:${navGap}px">${nav}</div>
    </div>
    <div class="c-title">${num}${esc(sec.title)}</div>
    <div class="c-rule-gray"></div>
    <div class="c-rule-red"></div>
    <div class="c-sub">${esc(s.subtitle||"")}</div>
    ${body}
    <div class="page-no">${esc(s._page)}</div>`;
}

function renderSlide(s){
  switch(s.type){
    case "cover":    return renderCover(s);
    case "contents": return renderContents(s);
    case "content":  return renderContent(s);
    case "ending":   return renderCover(s);
    default:         return `<div class="c-body">未知页面类型：${esc(s.type)}</div>`;
  }
}

/* —— 构建所有页面 —— */
const deckEl = document.getElementById("deck");
function build(){
  deckEl.innerHTML = "";
  let pageCounter = 0;
  deckConfig.slides.forEach((s,i)=>{
    // 仅内容页计页码（封面/目录/结尾不计），可按需调整
    if(s.type==="content"){ pageCounter++; s._page = pageCounter; }
    const sec = document.createElement("section");
    sec.className = "slide";
    sec.setAttribute("data-screen-label", String(i+1).padStart(2,"0"));
    sec.innerHTML = renderSlide(s);
    deckEl.appendChild(sec);
  });
  return deckConfig.slides.length;
}
const TOTAL = build();

/* =======================================================================
   ③ 缩放 + 翻页 + 持久化
   ======================================================================= */
const slides = [...document.querySelectorAll(".slide")];
document.getElementById("total").textContent = TOTAL;
let cur = Math.min(TOTAL-1, Math.max(0, parseInt(localStorage.getItem("pku_slide")||"0",10) || 0));

function show(i){
  cur = (i+TOTAL)%TOTAL;
  slides.forEach((el,k)=>el.classList.toggle("active",k===cur));
  document.getElementById("cur").textContent = cur+1;
  localStorage.setItem("pku_slide", cur);
}
function fit(){
  const w = window.innerWidth || document.documentElement.clientWidth;
  const h = window.innerHeight || document.documentElement.clientHeight;
  if(!w || !h) return;
  const s = Math.min(w/1920, h/1080);
  if(s>0) deckEl.style.transform = `scale(${s})`;
}
window.addEventListener("resize", fit);
window.addEventListener("load", fit);
if(window.ResizeObserver){ new ResizeObserver(fit).observe(document.documentElement); }
requestAnimationFrame(fit);
document.getElementById("prev").onclick = ()=>show(cur-1);
document.getElementById("next").onclick = ()=>show(cur+1);
document.getElementById("print").onclick = ()=>window.print();
window.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" ") {show(cur+1);e.preventDefault();}
  else if(e.key==="ArrowLeft"||e.key==="PageUp") {show(cur-1);e.preventDefault();}
  else if(e.key==="Home") show(0);
  else if(e.key==="End") show(TOTAL-1);
});
fit(); show(cur);
</script>
</body>
</html>
